<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light only">
  <title>Blog de Cirugía - Analia Torres</title>
  <meta name="description" content="Resúmenes de clase, talleres y diario de rotación de Cirugía. Universidad de Panamá, Facultad de Medicina.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='16' fill='%23ffe847'/%3E%3Cpath d='M16 8v16M8 16h16' stroke='%23171a52' stroke-width='4.5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
/* Zona segura para celulares con notch o barra inferior */
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
.top { top: env(safe-area-inset-top, 0px); padding-top: max(.7rem, env(safe-area-inset-top, 0px)); }

/* Estilos del blog. Los colores y la tipografia reales estan mas abajo, en el bloque TEMA "QUIROFANO EN NEGRO". */

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 5rem; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 1rem/1.55 var(--f-ui); min-height: 100vh; display: flex; flex-direction: column;
}
main { flex: 1; outline: none; }
a, a:link, a:visited { color: inherit; text-decoration: none; text-underline-offset: 3px; }
a:hover, a:focus { text-decoration: none; }
h1, h2, h3, h4 { margin: 0; line-height: 1.1; letter-spacing: -0.02em; font-weight: 700; font-variation-settings: "wdth" 92; }
p { margin: 0; }
img, svg { max-width: 100%; }
:focus-visible { outline: 3px solid var(--acc); outline-offset: 3px; border-radius: 6px; }

.skip { position: absolute; left: -999px; top: 0; background: var(--noche); color: #fff; padding: .6rem 1rem; z-index: 100; }
.skip:focus { left: 0; }

.wrap { width: min(1120px, 100% - 2.5rem); margin-inline: auto; }

/* ---------- Encabezado ---------- */
.top {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 1.25rem; flex-wrap: wrap;
  padding: .75rem clamp(1rem, 4vw, 2.5rem);
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: .8rem; text-decoration: none; color: var(--ink); }
.brand-bar { width: 4px; height: 2.3rem; background: var(--azul); border-radius: 2px; }
.brand-t { display: flex; flex-direction: column; line-height: 1.15; }
.brand-t b { font-size: 1.05rem; font-weight: 700; }
.brand-t small { font-size: .82rem; color: var(--muted); }

#nav { display: flex; gap: .3rem; margin-left: auto; }
#nav a { color: var(--ink); text-decoration: none; font-weight: 600; font-size: .95rem; padding: .5rem 1rem; border-radius: 999px; white-space: nowrap; }
#nav a:hover { background: var(--sky); }
#nav a[aria-current="page"] { background: var(--acc); color: var(--on-acc); }

.theme { width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer; border: 0; border-radius: 50%; background: var(--sky); color: var(--head); }
.theme:hover { background: var(--azul); color: var(--noche); }

@media (max-width: 860px) {
  .theme { margin-left: auto; }
  #nav { order: 3; width: 100%; margin-left: 0; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  #nav::-webkit-scrollbar { display: none; }
}

/* ---------- Componentes ---------- */
.banda { padding-block: clamp(3rem, 7vw, 5.5rem); }
.banda.sky { background: var(--sky); color: var(--ink); }
.banda.cab { padding-block: clamp(2rem, 5vw, 3.5rem); }
.banda.azul { background: var(--azul-banda); color: #fff; }
.banda.oscura { background: var(--banda-oscura); color: #fff; }

.tit { border-left: 5px solid var(--azul); padding-left: 1rem; }
.tit h1, .tit h2 { color: var(--acc); font-weight: 800; }
.tit h1 { font-size: clamp(2rem, 5vw, 3.3rem); }
.tit h2 { font-size: clamp(1.6rem, 3.5vw, 2.3rem); }
.tit .sub { margin-top: .4rem; color: var(--muted); font-size: 1.05rem; max-width: 56ch; }
.cab .tit h1 { color: var(--head); }
.cab .tit .sub { color: var(--pizarra); }
.banda.oscura .tit h2 { color: #5cc8ec; }
.banda.oscura .tit .sub { color: #b8ced6; }

.pill { display: inline-block; padding: .65rem 1.3rem; border-radius: 999px; font-weight: 700; background: var(--sky); color: var(--head); }
.pill.azul { background: var(--acc); color: var(--on-acc); }
.pill.oscura { background: var(--pizarra); color: #fff; }
.pills { display: flex; flex-wrap: wrap; gap: .7rem; }

.btn { display: inline-block; padding: .8rem 1.5rem; border-radius: 999px; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; border: 2px solid var(--acc); background: var(--acc); color: var(--on-acc); }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--acc); }
.btn.ghost:hover { background: var(--soft); filter: none; }
.btn.claro { background: #fff; border-color: #fff; color: var(--noche); }
.btn.contorno { background: transparent; border-color: #fff; color: #fff; }
.btn.contorno:hover { background: rgba(255,255,255,.14); filter: none; }
.acciones { display: flex; gap: .75rem; flex-wrap: wrap; }

.barra { display: block; height: 7px; background: color-mix(in srgb, currentColor 16%, transparent); border-radius: 99px; overflow: hidden; }
.barra u { display: block; height: 100%; background: var(--azul); text-decoration: none; border-radius: 99px; }

/* ---------- Inicio ---------- */
.hero { padding-block: clamp(2rem, 5vw, 3.5rem) 1.5rem; }
.hero-grid { display: grid; gap: 2rem; align-items: stretch; }
@media (min-width: 900px) { .hero-grid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); min-height: min(70vh, 600px); gap: 3rem; } }
.hero-t { display: flex; flex-direction: column; justify-content: space-between; gap: 2.5rem; }
.marca { align-self: flex-start; border-left: 4px solid var(--azul); padding-left: .8rem; font-weight: 700; font-size: 1.05rem; color: var(--head); }
.hero h1 { font-size: clamp(3rem, 8vw, 5.8rem); line-height: .98; letter-spacing: -.04em; font-weight: 800; color: var(--head); font-variation-settings: "wdth" 84; text-wrap: balance; margin-bottom: 1.6rem; }
.hero-art { display: grid; place-items: center; }
.hero-art svg { width: 100%; max-width: 560px; height: auto; }

.sutura { margin-top: clamp(1.5rem, 4vw, 2.5rem); height: 56px; overflow: hidden; }
.sutura svg { display: block; width: 100%; height: 56px; }
.sutura .inc { stroke: var(--pizarra); stroke-width: 3.4; stroke-linecap: round; fill: none; }
.sutura .pt path { stroke: var(--acc); stroke-width: 2.8; stroke-linecap: round; fill: none; stroke-dasharray: 1; stroke-dashoffset: 1; animation: hilo .32s ease-out forwards; animation-delay: calc(var(--i) * 42ms + .15s); }
.sutura .pt circle { fill: var(--acc); opacity: 0; animation: nudo .15s ease-out forwards; animation-delay: calc(var(--i) * 42ms + .35s); }
@keyframes hilo { to { stroke-dashoffset: 0; } }
@keyframes nudo { to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) {
  .sutura .pt path { animation: none; stroke-dashoffset: 0; }
  .sutura .pt circle { animation: none; opacity: 1; }
  html { scroll-behavior: auto; }
}

.about { text-align: center; }
.about .wrap { max-width: 780px; }
.about h2 { font-size: clamp(1.9rem, 4vw, 2.7rem); font-weight: 800; }
.about p { margin: 1.1rem auto 0; font-size: 1.2rem; line-height: 1.6; max-width: 54ch; }
.about .bajar { margin: 1.75rem auto 1.5rem; display: grid; place-items: center; width: 62px; height: 62px; border-radius: 50%; border: 0; background: rgba(255,255,255,.18); cursor: pointer; }
.about .bajar:hover { background: rgba(255,255,255,.3); }
.about .acciones { justify-content: center; }

.dos-col { display: grid; gap: 2.5rem; align-items: start; }
@media (min-width: 900px) { .dos-col { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 4rem; } }
.dos-col .txt { margin-top: 1.25rem; max-width: 40ch; color: var(--muted); }

.pastillas { list-style: none; margin: 0; padding: 0; display: grid; gap: .8rem; }
.pasti { position: relative; overflow: hidden; border-radius: 28px; background: var(--sky); min-height: 3.6rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .7rem 1.4rem; color: var(--ink); }
.pasti .rel { position: absolute; inset: 0 auto 0 0; width: var(--p); background: var(--fill); }
.pasti .t, .pasti .n { position: relative; }
.pasti .t { font-weight: 600; }
.pasti .n { font-weight: 700; white-space: nowrap; }
.pasti .t, .pasti .n { color: var(--fill-ink); }
.pasti.ok .n::before { content: "✓ "; }

.tarjetas { list-style: none; margin: 2rem 0 0; padding: 0; display: grid; gap: 1.1rem; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); }
.tarj { display: flex; flex-direction: column; gap: .55rem; height: 100%; padding: 1.4rem; border-radius: 28px; background: var(--pizarra); color: #fff; text-decoration: none; }
.tarj:hover { background: #38505a; }
.tarj .ico { align-self: flex-start; min-width: 4.2rem; text-align: center; padding: .5rem 1.1rem; border-radius: 999px; background: var(--azul); color: var(--noche); font-weight: 800; font-size: 1.15rem; }
.tarj b { color: #5cc8ec; font-size: 1.15rem; line-height: 1.2; margin-top: .35rem; }
.tarj span.d { color: #d4e4ea; font-size: .95rem; }
.tarj .barra { margin-top: auto; color: #fff; }

.recientes { list-style: none; padding: 0; margin: 1.75rem 0 0; display: grid; gap: .5rem; }
.vacio-simple { margin-top: 1.75rem; padding: 1.5rem; border: 2px dashed var(--line); border-radius: 26px; color: var(--muted); max-width: 60ch; }

.losetas { display: grid; gap: 1.25rem; }
@media (min-width: 860px) { .losetas { grid-template-columns: 1fr 1fr; } }
.loseta {
  padding: clamp(1.6rem, 4vw, 2.5rem); border-radius: 34px; color: #fff; background-color: var(--azul-banda);
  background-image: linear-gradient(rgba(255,255,255,.14) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.14) 1px, transparent 1px);
  background-size: 26px 26px; display: flex; flex-direction: column; gap: 1rem; align-items: flex-start;
}
.loseta h2 { font-size: clamp(1.6rem, 3.5vw, 2.3rem); border-left: 4px solid #fff; padding-left: .9rem; font-weight: 800; }
.loseta p { font-size: 1.1rem; max-width: 40ch; }
.cierre { margin-top: 2.5rem; }

/* ---------- Listas ---------- */
.pagina { padding-block: 2.5rem 4rem; }
.tools { display: flex; flex-wrap: wrap; gap: .75rem 1rem; align-items: end; padding: 1.1rem 1.25rem; background: var(--soft); border-radius: 28px; }
.field { display: flex; flex-direction: column; gap: .3rem; font-size: .85rem; font-weight: 700; color: var(--muted); }
.field { min-width: 0; }
.field.grow { flex: 1 1 240px; }
.field input, .field select { font: inherit; font-size: 1rem; font-weight: 500; color: var(--ink); background: var(--bg); border: 2px solid transparent; border-radius: 999px; padding: .6rem 1.1rem; min-height: 44px; }
.field input:focus, .field select:focus { border-color: var(--azul); outline: none; }
.tog { display: flex; align-items: center; gap: .55rem; min-height: 44px; font-weight: 600; cursor: pointer; }
.tog input { width: 1.2rem; height: 1.2rem; accent-color: var(--acc); }
.count { margin: 1.25rem 0 0; color: var(--muted); font-size: .95rem; }

.sem { margin-top: 2.25rem; }
.sem > h2 { display: flex; align-items: baseline; gap: .8rem; font-size: 1.5rem; color: var(--acc); border-left: 5px solid var(--azul); padding-left: .85rem; margin-bottom: 1rem; }
.sem > h2 small { font-size: .95rem; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.sem ol { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }

.row { display: grid; grid-template-columns: 2.5rem minmax(0, 1fr) 9.5rem; gap: .25rem 1rem; align-items: center; padding: .75rem 1.2rem .75rem .75rem; border-radius: 24px; background: var(--soft); color: var(--ink); text-decoration: none; }
.row:hover { background: var(--sky); }
.row .n { width: 2.5rem; height: 2.5rem; display: grid; place-items: center; border-radius: 50%; background: var(--azul); color: var(--noche); font-weight: 800; font-size: .95rem; }
.row .t b { font-weight: 600; font-size: 1.05rem; line-height: 1.25; }
.row .t small { display: block; color: var(--muted); font-size: .9rem; margin-top: .15rem; }
.row .a { font-size: .9rem; font-weight: 500; line-height: 1.25; display: flex; align-items: center; gap: .5rem; }
.dot { width: .7rem; height: .7rem; border-radius: 50%; background: var(--c); flex: none; }
.tag { display: inline-block; margin-left: .5rem; padding: .05rem .65rem; border-radius: 99px; font-size: .78rem; font-weight: 700; vertical-align: .1em; background: var(--pizarra); color: #fff; }
.tag.taller { background: var(--azul); color: var(--noche); }
.st { font-size: .85rem; font-weight: 700; white-space: nowrap; }
.st.ok { color: var(--acc); }
.st.ok::before { content: "✓ "; }
.st.no { color: var(--muted); font-weight: 500; }
@media (max-width: 600px) { .field { flex: 1 1 100%; } .field select, .field input { width: 100%; } }
@media (max-width: 760px) {
  .row { grid-template-columns: 2.5rem minmax(0, 1fr); }
  .row .est { grid-column: 2; }
}
.sinres { margin-top: 2rem; padding: 2rem; border: 2px dashed var(--line); border-radius: 26px; text-align: center; color: var(--muted); }

/* ---------- Lector de resumen ---------- */
.cab .back { display: inline-block; font-weight: 700; text-decoration: none; margin-bottom: 1.5rem; color: var(--head); }
.cab .back::before { content: "‹ "; }
.cab .pills { margin-top: 1.5rem; }
.cab .pill { background: #fff; }
.cab .pill.azul { background: var(--acc); }
.cab .pill.oscura { background: var(--pizarra); }
.cab .by { margin-top: .6rem; font-size: 1.1rem; color: var(--pizarra); }

.cols { display: grid; gap: 2.5rem; }
@media (min-width: 980px) { .cols { grid-template-columns: minmax(0, 1fr) 310px; gap: 4rem; } }
.cuerpo { max-width: 66ch; font-family: var(--f-read); font-size: 1.15rem; line-height: 1.8; }
.cuerpo p { margin: 0 0 1.2em; }
.cuerpo h3 { font-family: var(--f-ui); font-size: 1.4rem; margin: 2em 0 .6em; color: var(--acc); border-left: 4px solid var(--azul); padding-left: .7rem; }
.cuerpo ul { padding-left: 1.3em; margin: 0 0 1.2em; }
.cuerpo li { margin-bottom: .35em; }

.perla { max-width: 66ch; margin-top: 2rem; padding: 1.4rem 1.6rem; border-radius: 28px; background: var(--banda-oscura); color: #fff; }
.perla h4 { display: inline-block; font-size: .9rem; padding: .25rem .9rem; border-radius: 99px; background: var(--azul); color: var(--noche); margin-bottom: .8rem; }
.perla p { font-family: var(--f-read); font-size: 1.12rem; line-height: 1.6; }

.pendiente { max-width: 60ch; padding: 2rem; border: 2px dashed var(--line); border-radius: 28px; background: var(--soft); }
.pendiente h2 { font-size: 1.5rem; margin-bottom: .6rem; color: var(--acc); }
.pendiente p { color: var(--muted); }

.lado { display: flex; flex-direction: column; gap: 1.25rem; }
@media (min-width: 980px) { .lado { position: sticky; top: 5.5rem; align-self: start; } }
.ficha { background: var(--soft); border-radius: 28px; padding: 1.3rem 1.5rem; }
.ficha h2 { font-size: 1.1rem; margin-bottom: .8rem; color: var(--acc); }
.ficha dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: .45rem 1rem; font-size: .95rem; }
.ficha dt { color: var(--muted); }
.ficha dd { margin: 0; font-weight: 600; }
.claves { list-style: none; padding: 0; margin: 0; display: grid; gap: .65rem; }
.claves label { display: grid; grid-template-columns: 1.3rem 1fr; gap: .6rem; cursor: pointer; line-height: 1.35; }
.claves input { width: 1.15rem; height: 1.15rem; margin-top: .1rem; accent-color: var(--acc); }
.claves input:checked + span { color: var(--muted); text-decoration: line-through; }

.flash { max-width: 66ch; margin-top: 2.5rem; }
.flash h2 { font-size: 1.5rem; margin-bottom: .3rem; color: var(--acc); }
.flash > p { color: var(--muted); margin-bottom: 1rem; }
.fcs { display: grid; gap: .9rem; }
@media (min-width: 640px) { .fcs { grid-template-columns: 1fr 1fr; } }
.fc { font: inherit; text-align: left; color: var(--ink); cursor: pointer; padding: 1.15rem 1.3rem; min-height: 7.5rem; background: var(--sky); border: 0; border-radius: 28px; display: flex; flex-direction: column; gap: .7rem; }
.fc:hover { background: color-mix(in srgb, var(--azul) 35%, var(--sky)); }
.fc .q { font-weight: 700; }
.fc .r { display: none; font-family: var(--f-read); padding-top: .7rem; border-top: 1px solid rgba(255,255,255,.3); }
.fc .hint { font-size: .8rem; color: var(--muted); margin-top: auto; }
.fc[aria-expanded="true"] { background: var(--pizarra); color: #fff; }
.fc[aria-expanded="true"] .q { color: #5cc8ec; }
.fc[aria-expanded="true"] .r { display: block; }
.fc[aria-expanded="true"] .hint { display: none; }

.pn { display: flex; justify-content: space-between; gap: 1rem; margin-top: 3.5rem; padding-top: 1.5rem; border-top: 1px solid var(--line); }
.pn a { display: block; max-width: 22rem; text-decoration: none; color: var(--ink); padding: .8rem 1.1rem; border-radius: 22px; }
.pn a:hover { background: var(--soft); }
.pn small { display: block; color: var(--muted); }
.pn b { font-weight: 600; }
.pn .sig { text-align: right; margin-left: auto; }

/* ---------- Rotación ---------- */
.tabs { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.75rem; }
.tabs button { font: inherit; font-weight: 700; cursor: pointer; padding: .65rem 1.3rem; border-radius: 999px; border: 0; background: #fff; color: var(--head); }
.tabs button:hover { background: var(--azul); color: var(--noche); }
.tabs button[aria-selected="true"] { background: var(--acc); color: var(--on-acc); }
.semana-cab { margin-top: .5rem; }
.semana-cab h2 { font-size: 1.8rem; color: var(--acc); }
.semana-cab p { color: var(--muted); margin-top: .3rem; }
.aviso { margin-top: 1.25rem; padding: 1rem 1.3rem; background: var(--soft); border-radius: 22px; font-size: .95rem; max-width: 64ch; }
.aviso b { color: var(--acc); }

.dias { list-style: none; margin: 1.75rem 0 0 .6rem; padding: 0; border-left: 3px solid var(--sky); }
.dia { position: relative; padding-left: 1.7rem; padding-bottom: .9rem; }
.dia::before { content: ""; position: absolute; left: -.72rem; top: .95rem; width: 1.1rem; height: 1.1rem; border-radius: 50%; background: var(--bg); border: 3px solid var(--azul); }
.dia.ok::before { background: var(--azul); }
.dia details { background: var(--soft); border-radius: 24px; }
.dia details[open] { box-shadow: 0 0 0 2px var(--azul); }
.dia summary { list-style: none; cursor: pointer; display: flex; gap: 1rem; align-items: baseline; padding: .95rem 1.3rem; }
.dia summary::-webkit-details-marker { display: none; }
.dia summary::after { content: "+"; margin-left: auto; font-weight: 700; font-size: 1.4rem; color: var(--acc); }
.dia details[open] summary::after { content: "–"; }
.dia .dn { font-weight: 800; white-space: nowrap; color: var(--acc); }
.dia .dt { font-weight: 600; }
.dia .dt.vacio { color: var(--muted); font-weight: 400; }
.dia .dc { padding: .2rem 1.3rem 1.3rem; display: grid; gap: 1.1rem; }
.dia .dc h3 { font-size: 1rem; color: var(--acc); margin-bottom: .25rem; }
.dia .dc p { font-family: var(--f-read); font-size: 1.08rem; line-height: 1.7; max-width: 64ch; margin-bottom: .6em; }
.dia .dc ul { font-family: var(--f-read); font-size: 1.08rem; line-height: 1.7; margin: 0 0 .6em; padding-left: 1.2em; }
.dia .dc .nada { color: var(--muted); font-family: var(--f-ui); font-size: .98rem; }

/* ---------- Sobre mí ---------- */
.sobre { display: grid; gap: 2.5rem; }
@media (min-width: 860px) { .sobre { grid-template-columns: minmax(0, 1.3fr) minmax(260px, 1fr); gap: 4rem; } }
.sobre .cuerpo { font-size: 1.2rem; }

/* ---------- Pie ---------- */
.pie { margin-top: 0; padding: 2rem clamp(1rem, 4vw, 2.5rem) 2.5rem; background: var(--banda-oscura); color: #b8ced6; font-size: .9rem; display: grid; gap: .5rem; }
.pie p { max-width: 70ch; }
.pie #pie-firma { color: #fff; font-weight: 600; }

/* ---------- Ilustración: tinta que cambia en modo oscuro ---------- */
.tinta { fill: #182527; }
.tintas { stroke: #182527; }

/* =====================================================================
   Secciones nuevas
   ===================================================================== */
body.sin-scroll { overflow: hidden; }
.pill.peq { padding: .25rem .85rem; font-size: .85rem; }
.btn.peq { padding: .5rem 1.1rem; font-size: .92rem; }
.est { display: flex; flex-direction: column; align-items: flex-start; }

/* Fotos y espacios para fotos */
.foto-vacia {
  width: 100%; height: 100%; min-height: 9rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem; padding: 1rem; text-align: center;
  border: 2px dashed color-mix(in srgb, var(--acc) 45%, transparent); border-radius: 28px; background: var(--soft); color: var(--acc); font-weight: 600; font-size: .95rem;
}
.foto-cel { aspect-ratio: 4 / 3; }
.galeria { display: grid; gap: .9rem; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); margin-top: 1rem; }
.foto { padding: 0; border: 0; background: var(--soft); border-radius: 24px; overflow: hidden; cursor: zoom-in; aspect-ratio: 4 / 3; display: block; width: 100%; }
.foto img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s; }
.foto:hover img { transform: scale(1.04); }
.foto .foto-vacia { border-radius: 24px; }

.lb { position: fixed; inset: 0; z-index: 200; background: rgba(10, 20, 22, .92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; gap: .8rem; }
.lb[hidden] { display: none; }
.lb img { max-width: min(96vw, 1200px); max-height: 82vh; border-radius: 18px; object-fit: contain; background: #fff; }
.lb-cap { color: #e6f1f4; font-weight: 500; }
.lb-x { position: absolute; top: 1rem; right: 1rem; width: 46px; height: 46px; border-radius: 50%; border: 0; background: #fff; color: var(--noche); font-size: 1.8rem; line-height: 1; cursor: pointer; }

/* Visor de documentos */
.visor { margin-top: 0; }
.visor-carga { color: var(--muted); padding: 1rem 0; }
.visor-bar { display: flex; flex-wrap: wrap; gap: .6rem 1rem; align-items: center; justify-content: space-between; padding: .75rem 1.1rem; background: var(--pizarra); color: #fff; border-radius: 22px 22px 0 0; }
.visor-t { font-weight: 700; }
.visor-btns { display: flex; gap: .5rem; flex-wrap: wrap; }
.visor-bar .btn { border-color: #fff; background: #fff; color: var(--noche); }
.visor-bar .btn.ghost { background: transparent; color: #fff; }
.visor-frame { display: block; width: 100%; height: clamp(480px, 82vh, 900px); border: 2px solid var(--pizarra); border-top: 0; border-radius: 0 0 22px 22px; background: #fff; }
.visor-img { display: block; width: 100%; border: 2px solid var(--pizarra); border-top: 0; border-radius: 0 0 22px 22px; }
.visor-nota { margin-top: .6rem; font-size: .88rem; color: var(--muted); }
.visor .pendiente { max-width: none; }
.cols .visor + .cuerpo, .cols .visor + .perla { margin-top: 2rem; }

/* Inicio: sobre mí */
.sobre-mi { display: grid; gap: 2.5rem; align-items: center; }
@media (min-width: 860px) { .sobre-mi { grid-template-columns: minmax(240px, 380px) minmax(0, 1fr); gap: 4rem; } }
.retrato { aspect-ratio: 4 / 5; border-radius: 40px; overflow: hidden; background: rgba(255, 255, 255, .16); max-width: 380px; width: 100%; }
.retrato img { width: 100%; height: 100%; object-fit: cover; display: block; }
.retrato .foto-vacia { color: #fff; border-color: rgba(255, 255, 255, .7); background: transparent; border-radius: 40px; }
.tit-blanco { border-left-color: #fff; }
.tit-blanco h2 { color: #fff; font-size: clamp(1.9rem, 4vw, 2.7rem); }
.tit-blanco .sub { color: #e6f6fb; }
.texto-blanco { margin: 1.4rem 0 1.5rem; font-size: 1.18rem; line-height: 1.65; max-width: 52ch; }
.texto-blanco p { margin: 0 0 1em; }

/* Inicio: profesores */
.profes { list-style: none; margin: 2.25rem 0 0; padding: 0; display: grid; gap: 2rem 1.25rem; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.prof { display: flex; flex-direction: column; align-items: center; text-align: center; }
.avatar { width: 124px; height: 124px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--pizarra); flex: none; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar.ini { background: var(--pizarra); color: #5cc8ec; font-weight: 800; font-size: 2.2rem; letter-spacing: -.02em; }
.prof-n { margin-top: -1.1rem; position: relative; padding: .4rem 1.1rem; border-radius: 999px; background: var(--azul); color: var(--noche); font-weight: 700; font-size: .95rem; max-width: 100%; }
.prof-d { margin-top: .5rem; color: #c9dbe1; font-size: .92rem; }
.prof details { margin-top: .5rem; width: 100%; text-align: left; }
.prof summary { cursor: pointer; text-align: center; color: #5cc8ec; font-weight: 600; font-size: .9rem; list-style: none; padding: .35rem; }
.prof summary::-webkit-details-marker { display: none; }
.prof summary::after { content: " +"; }
.prof details[open] summary::after { content: " –"; }
.prof ul { list-style: none; margin: .4rem 0 0; padding: .8rem 1rem; background: var(--pizarra); border-radius: 22px; display: grid; gap: .45rem; font-size: .9rem; }
.prof ul a { color: #fff; text-decoration: none; }
.prof ul a:hover { text-decoration: underline; }

/* Inicio: atajos */
.atajos { list-style: none; margin: 2rem 0 0; padding: 0; display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
@media (min-width: 900px) { .atajos { grid-template-columns: repeat(3, 1fr); } }
.atajo { display: flex; flex-direction: column; gap: .3rem; height: 100%; padding: 1.4rem 1.5rem; border-radius: 30px; background: var(--bg); color: var(--ink); text-decoration: none; border: 2px solid transparent; }
.atajo b { font-size: 1.35rem; color: var(--acc); }
.atajo span { color: var(--muted); }
.atajo:hover { border-color: var(--azul); }

/* Talleres */
.taller { padding-bottom: 2.5rem; margin-bottom: 2.5rem; border-bottom: 1px solid var(--line); }
.taller:last-child { border-bottom: 0; }
.taller .pills { margin-top: 1rem; }
.dos-taller { display: grid; gap: 2rem; margin-top: 1.5rem; }
@media (min-width: 900px) { .dos-taller { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 3rem; } }
.dos-taller .cuerpo { margin-bottom: 1.5rem; }
.dos-taller .galeria { margin-top: 0; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }

/* Rotaciones */
.bloque { margin-top: 1.75rem; }
.mini { font-size: 1.1rem; color: var(--acc); }
.bloque .cuerpo { max-width: 66ch; }

/* Multimedia */
.chips { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.75rem; }
.chip { font: inherit; font-weight: 700; cursor: pointer; padding: .55rem 1.2rem; border-radius: 999px; border: 0; background: #fff; color: var(--head); }
.chip:hover { background: var(--azul); color: var(--noche); }
.chip[aria-pressed="true"] { background: var(--acc); color: var(--on-acc); }
.mm-grid { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.mm { margin: 0; }
.mm .foto { aspect-ratio: 4 / 3; }
.mm-video { display: block; width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 24px; background: var(--noche); }
.mm-video.enlace { display: grid; place-items: center; }
.mm figcaption { padding: .7rem .4rem 0; display: flex; flex-direction: column; gap: .15rem; }
.mm figcaption span { color: var(--muted); font-size: .92rem; }

/* Trabajos */
.trabajos { list-style: none; margin: 0; padding: 0; display: grid; gap: .8rem; }
.trabajo details { background: var(--soft); border-radius: 26px; }
.trabajo details[open] { box-shadow: 0 0 0 2px var(--azul); }
.trabajo summary { list-style: none; cursor: pointer; display: flex; gap: 1rem; align-items: center; padding: 1.1rem 1.4rem; }
.trabajo summary::-webkit-details-marker { display: none; }
.trabajo summary::after { content: "+"; margin-left: auto; font-size: 1.5rem; font-weight: 700; color: var(--acc); }
.trabajo details[open] summary::after { content: "–"; }
.trabajo .tt { font-weight: 700; font-size: 1.1rem; }
.trabajo .tc { padding: .2rem 1.4rem 1.5rem; display: grid; gap: 1.25rem; }
.trabajo.vacio-t { display: flex; align-items: center; justify-content: center; min-height: 4.5rem; border: 2px dashed color-mix(in srgb, var(--acc) 45%, transparent); border-radius: 26px; color: var(--acc); font-weight: 600; }

/* Extras */
.extras { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.extra { background: var(--soft); border-radius: 30px; overflow: hidden; display: flex; flex-direction: column; }
.extra-f { aspect-ratio: 16 / 10; }
.extra-f img { width: 100%; height: 100%; object-fit: cover; display: block; }
.extra-f .foto-vacia { border-radius: 0; border: 0; border-bottom: 2px dashed color-mix(in srgb, var(--acc) 45%, transparent); background: color-mix(in srgb, var(--sky) 60%, transparent); }
.extra-t { padding: 1.2rem 1.4rem 1.5rem; display: flex; flex-direction: column; align-items: flex-start; gap: .5rem; }
.extra-t b { font-size: 1.15rem; }
.extra-t span { color: var(--muted); }
.vacio-simple { margin-top: 1.75rem; }

@media (max-width: 600px) {
  .profes { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.75rem .75rem; }
  .avatar { width: 96px; height: 96px; }
  .avatar.ini { font-size: 1.8rem; }
  .prof-n { font-size: .85rem; padding: .35rem .8rem; }
}

/* =====================================================================
   PORTADA del inicio: quirófano con tinte azul, título con resaltador y herramientas
   ===================================================================== */
:root { --f-portada: "Poppins", "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif; }

.portada {
  --tinte: rgba(26, 46, 214, .62); --resalta: #fce566;
  position: relative; isolation: isolate; overflow: hidden; color: #fff;
  min-height: 640px; min-height: max(100svh, 640px);
  display: grid; place-items: center; padding: 6.5rem 1rem 5rem;
  background:
    radial-gradient(45% 38% at 28% 22%, rgba(120, 150, 255, .55), transparent 70%),
    radial-gradient(40% 34% at 76% 26%, rgba(120, 150, 255, .45), transparent 70%),
    linear-gradient(180deg, #0f1a80, #0a1150);
}
.p-fondo { position: absolute; inset: -7% 0; z-index: -3; transform: translateY(calc(var(--sy, 0) * .28px)); will-change: transform; }
.p-foto { display: block; width: 100%; height: 100%; object-fit: cover; animation: p-zoom 2.8s cubic-bezier(.2, .7, .2, 1) backwards; }
.p-tinte { position: absolute; inset: 0; z-index: -2; background: var(--tinte); }
.p-tinte::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(5, 10, 60, .6), transparent 32%, transparent 65%, rgba(5, 10, 60, .55)); }

.p-centro { text-align: center; max-width: 100%; }
.p-titulo {
  margin: 0; font-family: var(--f-portada); font-weight: 800; color: #fff;
  font-size: clamp(2.3rem, 8.6vw, 7.4rem); line-height: 1.03; letter-spacing: -.035em; font-variation-settings: normal;
  text-shadow: 0 .04em .35em rgba(4, 8, 60, .35);
}
.p-l1 { display: block; overflow: hidden; padding: .04em .1em .08em; }
.p-txt { display: inline-block; animation: p-sube .9s cubic-bezier(.2, .8, .2, 1) .35s backwards; }
.p-l2 { display: inline-block; position: relative; margin-top: .02em; }
.p-l2t { position: relative; display: inline-block; padding: .02em .28em .1em; color: #0b0b12; text-shadow: none; }
.p-marca { position: absolute; inset: 0; background: var(--resalta); transform-origin: left center; animation: p-trazo .7s cubic-bezier(.7, 0, .2, 1) .75s backwards; }
.p-txt2 { position: relative; display: inline-block; animation: p-descubre .7s cubic-bezier(.7, 0, .2, 1) .9s backwards; }

.p-inst { position: absolute; z-index: 3; pointer-events: none; }
.p-mov { display: block; transform: translate3d(calc(var(--mx, 0) * 22px * var(--k, 1)), calc(var(--my, 0) * 14px * var(--k, 1)), 0); transition: transform .3s ease-out; }
.p-inst img { display: block; width: auto; }
.p-pinzas { --k: 1; left: calc(-.75em + var(--xp)); top: calc(-.5em + var(--yp)); }
.p-pinzas img { height: calc(2.9em * var(--tp)); transform: rotate(var(--gp)); animation: p-izq 1.1s cubic-bezier(.2, 1.15, .3, 1) 1.25s backwards, p-flota-p 6s ease-in-out 2.5s infinite; }
.p-bisturi { --k: -1; right: calc(-.6em - var(--xb)); top: calc(-.5em + var(--yb)); }
.p-bisturi img { height: calc(2.9em * var(--tb)); transform: rotate(var(--gb)); animation: p-der 1.1s cubic-bezier(.2, 1.15, .3, 1) 1.4s backwards, p-flota-b 7s ease-in-out 2.6s infinite; }

.p-pills { display: flex; flex-wrap: wrap; justify-content: center; gap: .6rem; margin-top: clamp(1.5rem, 4vw, 2.5rem); animation: p-aparece .8s ease 1.9s backwards; }
.p-pill { padding: .5rem 1.15rem; border-radius: 999px; border: 1.5px solid rgba(255, 255, 255, .75); font: 600 .95rem/1.2 var(--f-portada); color: #fff; }
.p-pill.llena { background: #fff; border-color: #fff; color: #10142e; }

.p-bajar { position: absolute; left: 50%; bottom: 1.6rem; width: 52px; height: 52px; margin-left: -26px; display: grid; place-items: center; border: 1.5px solid rgba(255, 255, 255, .7); border-radius: 50%; background: rgba(255, 255, 255, .1); cursor: pointer; animation: p-aparece .8s ease 2.3s backwards, p-rebota 2s ease-in-out 3.1s infinite; }
.p-bajar:hover { background: rgba(255, 255, 255, .25); }

/* La animación espera a que carguen las imágenes */
.portada:not(.lista) *, .portada:not(.lista) *::after { animation-play-state: paused !important; }

@keyframes p-zoom { from { transform: scale(1.16); } }
@keyframes p-sube { from { transform: translateY(115%); } }
@keyframes p-trazo { from { transform: scaleX(0); } }
@keyframes p-descubre { from { clip-path: inset(0 100% 0 0); } }
@keyframes p-izq { from { transform: translateX(-75vw) rotate(calc(var(--gp) - 260deg)); opacity: 0; } }
@keyframes p-der { from { transform: translateX(75vw) rotate(calc(var(--gb) + 260deg)); opacity: 0; } }
@keyframes p-flota-p { 0%, 100% { transform: translateY(0) rotate(var(--gp)); } 50% { transform: translateY(-9px) rotate(calc(var(--gp) + 2.5deg)); } }
@keyframes p-flota-b { 0%, 100% { transform: translateY(0) rotate(var(--gb)); } 50% { transform: translateY(-8px) rotate(calc(var(--gb) - 2.5deg)); } }
@keyframes p-aparece { from { opacity: 0; transform: translateY(14px); } }
@keyframes p-rebota { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(7px); } }

@media (max-width: 700px) {
  .portada { padding-inline: .6rem; }
  .p-titulo { font-size: clamp(2rem, 9vw, 3.4rem); }
  .p-pinzas { left: calc(-.5em + var(--xp)); }
  .p-bisturi { right: calc(-.4em - var(--xb)); }
  .p-pinzas img { height: calc(2.3em * var(--tp)); }
  .p-bisturi img { height: calc(2.3em * var(--tb)); }
}
@media (prefers-reduced-motion: reduce) {
  .portada *, .portada *::after { animation: none !important; }
  .p-mov { transition: none; }
}

/* ---------- Encabezado: centrado, y transparente sobre la portada ---------- */
@media (min-width: 1000px) {
  .top { display: grid; grid-template-columns: 1fr auto 1fr; }
  #nav { margin: 0; }
  .theme { justify-self: end; margin-left: 0; }
}
.top, #nav a, .theme, .brand-t b, .brand-t small { transition: background-color .35s ease, color .35s ease, border-color .35s ease, backdrop-filter .35s ease; }

/* El menú ahora es siempre igual (negro sólido, fijo arriba): la portada nueva ya es negra de por sí, así que no hace falta el truco de menú transparente. */

/* ---------- Transiciones entre secciones ---------- */
.ruta-in > * { animation: ruta-in .5s cubic-bezier(.2, .7, .2, 1) backwards; }
@keyframes ruta-in { from { opacity: 0; transform: translateY(16px); } }
.revela { opacity: 0; transform: translateY(30px); transition: opacity .8s ease, transform .8s cubic-bezier(.2, .7, .2, 1); transition-delay: var(--d, 0ms); }
.revela.visto { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) {
  .ruta-in > * { animation: none; }
  .revela { opacity: 1; transform: none; transition: none; }
}

/* =====================================================================
   PORTADA COMO IMAGEN (tu diseño de Canva tal cual) y ajustes exactos del modo por capas
   ===================================================================== */
.solo-lectores { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.portada-img { display: block; padding: 0; height: 100vh; height: 100svh; min-height: 520px; background: #13080f; }
.pi-fondo { position: absolute; inset: 0; z-index: -3; overflow: hidden; }
.pi-blur { display: block; width: 100%; height: 100%; object-fit: cover; filter: blur(30px) saturate(1.15); transform: scale(1.2); opacity: 0; }
.pi-marco { position: absolute; inset: 0; transform: translateY(calc(var(--sy, 0) * .22px)); will-change: transform; }
.pi-img {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center;
  transform: translate3d(calc(var(--mx, 0) * -14px), calc(var(--my, 0) * -9px), 0) scale(1.03);
  transition: transform .4s ease-out;
  animation: pi-abre 1.6s cubic-bezier(.7, 0, .2, 1) backwards;
}
.pi-top { position: absolute; inset: 0 0 auto 0; height: 24%; background: linear-gradient(180deg, rgba(0, 0, 0, .72), rgba(0, 0, 0, 0)); pointer-events: none; }
@keyframes pi-abre { from { clip-path: inset(0 50% 0 50%); transform: scale(1.18); filter: brightness(1.7); } }

@media (max-width: 820px) {
  .portada-img { height: auto; min-height: 0; padding: 7.6rem 0 4.6rem; }
  .pi-blur { opacity: 1; }
  .pi-marco { position: relative; inset: auto; transform: none; overflow: hidden; }
  .pi-img { position: relative; inset: auto; width: 116%; max-width: none; margin-left: -8%; height: auto; aspect-ratio: 1907 / 1076; object-fit: contain; transform: none; }
  .pi-top { height: 40%; }
}

/* Modo por capas: medidas exactas de tu diseño (1366 x 768, título de 89 px) */
.p-fondo { background: radial-gradient(45% 38% at 28% 22%, rgba(90, 120, 255, .25), transparent 70%), var(--fondo-color, #13080f); }
.p-foto { opacity: var(--fondo-op, .53); }
.p-tinte::after { background: linear-gradient(180deg, rgba(0, 0, 0, .6), transparent 28%); }
.p-titulo { letter-spacing: -.03em; }
.p-l2t { line-height: 1.23; padding: 0 .18em; }
.p-inst { transform: translate(-50%, -50%); right: auto; }
.p-inst .p-mov { width: 100%; height: 100%; }
.p-inst img { width: 100%; height: 100%; object-fit: contain; }
.p-pinzas { left: calc(-.12em + var(--xp)); top: calc(.77em + var(--yp)); width: calc(2.63em * var(--tp)); height: calc(1.76em * var(--tp)); }
.p-bisturi { left: calc(100% + var(--xb)); top: calc(.82em + var(--yb)); width: calc(3.03em * var(--tb)); height: calc(2.03em * var(--tb)); }

/* =====================================================================
   TEMA "BITÁCORA": collage tipo scrapbook, papel kraft, gasa verde,
   letra manuscrita para títulos y Poppins para el texto.
   ===================================================================== */
:root {
  --amarillo: #bfe0c9;         /* ya no es amarillo: verde menta claro, para no romper selectores viejos */
  --tinta: #362d1f;
  --bg: #fbf6e9;               /* papel crema, más cálido y luminoso */
  --sky: #f2e9cd;              /* kraft claro, para cabeceras */
  --azul: #5cae82;             /* verde menta: el acento principal, más vivo */
  --azul-banda: #4f9d75;
  --acc: #2f7a52;
  --on-acc: #fbf6e9;
  --noche: #33291c;
  --pizarra: #3d5a45;
  --head: #33291c;
  --ink: #3c3221;
  --muted: #5f5236;
  --soft: #f0e6c8;
  --line: #e2d19f;
  --banda-oscura: #2c4a34;
  --kraft: #f7efd6;
  --kraft-borde: #dcc590;
  --musgo: #5cae82;
  --musgo-osc: #2f7a52;
  --coral: #e8895f;            /* segundo acento: terracota/coral, para variedad sin ser neón */
  --coral-osc: #c96a41;
  --escrub: #6fa3c7;           /* tercer acento: azul de bata quirúrgica */
  --escrub-osc: #3f7ea3;
  --f-ui: "Poppins", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --f-read: "Poppins", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --f-hand: "Caveat", "Comic Sans MS", var(--f-ui);
}
body { line-height: 1.65; background-color: var(--bg); background-image: none; }
h1, h2, h3 {
  font-family: var(--f-hand); font-variation-settings: normal; letter-spacing: 0; font-weight: 700;
  transform: rotate(-.4deg);
}
h4 { font-variation-settings: normal; letter-spacing: -.02em; font-weight: 800; }

/* ---- Textura de gasa/tela sobre las bandas de color ---- */
.banda.sec, .banda.cab, .portada-formal {
  background-color: var(--sky);
  background-image:
    linear-gradient(rgba(255, 255, 255, .38) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, .38) 1px, transparent 1px);
  background-size: 9px 9px;
}

/* ---- Etiqueta de papel rasgado: la usan los títulos (.tit) y la portada ---- */
.rasgado {
  position: relative; display: inline-block; background: var(--kraft); color: var(--tinta);
  padding: .35em .7em .45em; box-shadow: 0 3px 0 rgba(0, 0, 0, .06), 0 10px 18px rgba(35, 36, 29, .12);
  clip-path: polygon(0% 6%, 3% 1%, 7% 5%, 11% 0%, 16% 4%, 21% 1%, 26% 5%, 31% 0%, 37% 4%, 43% 1%, 49% 5%, 55% 0%, 61% 4%, 67% 1%, 73% 5%, 79% 0%, 85% 4%, 91% 1%, 96% 5%, 100% 0%, 100% 94%, 96% 99%, 91% 95%, 85% 100%, 79% 96%, 73% 100%, 67% 95%, 61% 99%, 55% 95%, 49% 100%, 43% 96%, 37% 100%, 31% 95%, 26% 99%, 21% 95%, 16% 100%, 11% 96%, 7% 100%, 3% 95%, 0% 99%);
}

/* ---- Estrella/sol para numerar (índice, número de clase) ---- */
.estrella {
  position: relative; display: inline-flex; align-items: center; justify-content: center;
  color: var(--tinta); font-family: var(--f-hand); font-weight: 700;
  background: var(--musgo);
  clip-path: polygon(50% 0%, 61% 18%, 82% 10%, 80% 33%, 100% 41%, 84% 58%, 92% 79%, 70% 76%, 63% 97%, 50% 79%, 37% 97%, 30% 76%, 8% 79%, 16% 58%, 0% 41%, 20% 33%, 18% 10%, 39% 18%);
}

/* ---- Cinta washi (adorno de esquina) ---- */
.washi { position: absolute; width: 3.4rem; height: 1.3rem; background: color-mix(in srgb, var(--musgo) 55%, transparent); transform: rotate(-8deg); box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }

/* ---- Títulos con resaltador amarillo, como en la portada ---- */
.tit { border-left: 0; padding-left: 0; }
.tit h1, .tit h2, .banda .tit h1, .banda .tit h2, .banda.oscura .tit h2, .cab .tit h1, .tit-blanco h2 {
  display: inline; background: var(--amarillo); color: var(--tinta);
  padding: .02em .28em .07em; line-height: 1.34; font-weight: 800; letter-spacing: -.03em;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.tit h1 { font-size: clamp(1.9rem, 5vw, 3.5rem); }
.tit h2 { font-size: clamp(1.5rem, 3.4vw, 2.4rem); }
.tit .sub { display: block; margin-top: 1.1rem; }
.hl { display: inline-block; background: var(--amarillo); color: var(--tinta); padding: .02em .3em .07em; }
.sem > h2 { border-left: 0; padding-left: 0; color: var(--ink); }

/* ---- Encabezado negro, como antes ---- */
.top { background: rgba(10, 10, 10, .94); border-bottom: 1px solid rgba(255, 255, 255, .12); }
.brand, .brand-t b { color: #fff; }
.brand-t small { color: rgba(255, 255, 255, .75); }
.brand-bar { background: var(--musgo); }
#nav a { color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, .55); }
#nav a:hover { background: rgba(255, 255, 255, .16); }
#nav a[aria-current="page"] { background: #fff; color: var(--tinta); box-shadow: none; }
body.en-inicio.desplazado .top { background: rgba(10, 10, 10, .94); border-bottom-color: rgba(255, 255, 255, .12); }

/* ---- Cabeceras de página (Clases, Talleres, Rotaciones...): off-white, igual que el resto ---- */
.banda.cab { background: var(--soft); color: var(--ink); }
.banda.azul { background: var(--soft); color: var(--ink); }
.banda.oscura { background: var(--soft); color: var(--ink); }
.cab .tit .sub { color: var(--muted); }
.cab .back { color: var(--head); }
.cab .by { color: var(--muted); }
.cab .pill { background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.cab .pill.azul { background: var(--amarillo); color: var(--tinta); box-shadow: none; }
.cab .pill.oscura { background: var(--pizarra); color: #fff; box-shadow: none; }
.tabs button, .chip { background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.tabs button:hover, .chip:hover { background: var(--sky); }
.tabs button[aria-selected="true"], .chip[aria-pressed="true"] { box-shadow: none; }

/* ---- Botones y píldoras ---- */
.btn { background: var(--amarillo); border-color: var(--amarillo); color: var(--tinta); transition: transform .2s ease, filter .2s ease, background-color .2s ease; }
.btn:hover { filter: none; transform: translateY(-2px) rotate(-1deg); background: #c9dcc3; border-color: #c9dcc3; }
.btn.ghost { background: transparent; color: var(--acc); border-color: var(--acc); }
.btn.ghost:hover { background: var(--soft); transform: translateY(-2px); }
.btn.claro { background: #fff; border-color: #fff; color: var(--tinta); }
.btn.contorno { background: transparent; border-color: #fff; color: #fff; }
.pill { background: var(--soft); color: var(--head); }
.pill.azul { background: var(--amarillo); color: var(--tinta); }
.pill.oscura { background: var(--musgo-osc); color: #fff; }
.banda.azul .pill.oscura { background: var(--tinta); }

/* ---- Listas y tarjetas ---- */
.row .n, .prof-n { background: var(--amarillo); color: var(--tinta); }
.row:hover { background: var(--sky); }
.tag.taller { background: var(--amarillo); color: var(--tinta); }
.cuerpo { font-size: 1.05rem; line-height: 1.75; }
.cuerpo h3 { border-left-color: var(--amarillo); }
.atajo { background: var(--soft); }
.atajo:hover { border-color: var(--amarillo); }
.prof-d { color: #cfcbc0; }
.prof summary { color: var(--amarillo); }
.avatar.ini { background: rgba(255, 255, 255, .1); color: var(--amarillo); }
.prof ul { background: rgba(255, 255, 255, .08); }
.fc[aria-expanded="true"] .q, .banda.oscura .tit .sub { color: #d8d4ca; }
.fc[aria-expanded="true"] .q { color: var(--amarillo); }
.dia::before, .trabajo details[open] { border-color: var(--amarillo); }
.lb { background: rgba(8, 10, 40, .94); }
.pie { background: var(--banda-oscura); color: #cfcfc0; }
.tinta { fill: #0b0b12; }
.tintas { stroke: #0b0b12; }
.visor-bar .btn.ghost { border-color: #fff; color: #fff; }
.visor-bar .btn.ghost:hover { background: rgba(255, 255, 255, .16); }

/* =====================================================================
   INICIO: portada como franja, fondo blanco abajo, catedrático y asistentes
   ===================================================================== */
/* La portada es solo una franja arriba */
.portada-img { height: clamp(360px, 52vh, 560px); min-height: 0; }
.portada { min-height: clamp(360px, 52vh, 560px); padding: 5.5rem 1rem 2.5rem; }
.p-titulo { font-size: clamp(2rem, 6.4vw, 5.4rem); }
.pi-top { height: 34%; }
@media (max-width: 820px) {
  .portada-img { height: auto; padding: 7rem 0 1.2rem; }
  .p-titulo { font-size: clamp(1.9rem, 8.6vw, 3.2rem); }
}

/* Todo lo de abajo, sobre fondo blanco */
.sec { background: var(--bg); color: var(--ink); }
.sec + .sec { border-top: 1px solid var(--line); }
.texto-bio { margin: 1.4rem 0 0; font-size: 1.08rem; line-height: 1.75; max-width: 56ch; }
.texto-bio p { margin: 0 0 1em; }
.retrato { background: var(--soft); }
.retrato .foto-vacia { color: var(--acc); border-color: color-mix(in srgb, var(--acc) 45%, transparent); background: transparent; }

.sub-h { display: inline-block; margin-top: 2.6rem; padding-bottom: .2rem; font-size: 1.25rem; color: var(--ink); border-bottom: 4px solid var(--amarillo); }
.profes { margin-top: 1.4rem; }
.avatar.ini { background: var(--musgo-osc); color: #fff; }
.prof-d { color: var(--muted); }
.prof summary { color: var(--acc); }
.prof ul { background: var(--soft); }
.prof ul a { color: var(--ink); }

/* Catedrático y asistentes: espacio para la foto */
.equipo-l { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 1.75rem 1rem; }
.avatar.grande { width: 150px; height: 150px; }
.avatar.vacio-av { flex-direction: column; gap: .3rem; align-content: center; justify-items: center; background: var(--soft); color: var(--acc); border: 2px dashed color-mix(in srgb, var(--acc) 50%, transparent); text-align: center; padding: .5rem; }
.avatar.vacio-av svg { width: 34px; height: 34px; }
.avatar.vacio-av small { font-size: .72rem; font-weight: 600; line-height: 1.2; }
@media (max-width: 600px) { .avatar.grande { width: 110px; height: 110px; } .avatar.vacio-av small { display: none; } }

/* Pie claro */
.pie { background: var(--soft); color: var(--muted); border-top: 1px solid var(--line); }
.pie #pie-firma { color: var(--ink); }
.portada-img { height: clamp(380px, 56vh, 600px); }
.portada { min-height: clamp(380px, 56vh, 600px); }
.pi-img { object-position: 50% 40%; }
@media (max-width: 820px) { .portada-img { height: auto; } .pi-img { object-position: center; } }

/* =====================================================================
   PORTADA "ESCENA": tu fondo del quirófano + pinzas y bisturí como capas animadas
   ===================================================================== */
.portada-esc { display: block; padding: 0; height: clamp(380px, 56vh, 600px); min-height: 0; background: #13080f; container-type: size; }
.pe-marco { --W: max(100cqw, calc(100cqh * 1.7723)); position: absolute; inset: 0; overflow: hidden; transform: translateY(calc(var(--sy, 0) * .22px)); will-change: transform; }
.pe-escena { position: absolute; width: var(--W); height: calc(var(--W) * .5642); left: calc((100cqw - var(--W)) / 2); top: calc((100cqh - var(--W) * .5642) * .4); }
.pe-img { display: block; width: 100%; height: 100%; object-fit: cover; transform: translate3d(calc(var(--mx, 0) * -10px), calc(var(--my, 0) * -6px), 0) scale(1.03); transition: transform .4s ease-out; animation: pi-abre 1.6s cubic-bezier(.7, 0, .2, 1) backwards; }
.pe-inst { position: absolute; transform: translate(-50%, -50%); pointer-events: none; }
.pe-mov { display: block; transform: translate3d(calc(var(--mx, 0) * 22px * var(--k, 1)), calc(var(--my, 0) * 14px * var(--k, 1)), 0); transition: transform .3s ease-out; }
.pe-inst img { display: block; width: 100%; height: auto; filter: drop-shadow(0 10px 16px rgba(3, 6, 50, .5)); }
.pe-pinzas { --k: 1; left: calc(20.9% + var(--xp, 0%)); top: calc(55.7% + var(--yp, 0%)); width: calc(11% * var(--tp, 1)); }
.pe-pinzas img { transform: rotate(var(--gp, -15deg)); animation: p-izq 1.1s cubic-bezier(.2, 1.15, .3, 1) 1s backwards, p-flota-p 6s ease-in-out 2.3s infinite; }
.pe-bisturi { --k: -1; left: calc(75.6% + var(--xb, 0%)); top: calc(55.7% + var(--yb, 0%)); width: calc(13.6% * var(--tb, 1)); }
.pe-bisturi img { transform: rotate(var(--gb, 158deg)); animation: p-der 1.1s cubic-bezier(.2, 1.15, .3, 1) 1.15s backwards, p-flota-b 7s ease-in-out 2.4s infinite; }
@media (max-width: 820px) {
  .portada-esc { height: auto; padding: 7rem 0 1.2rem; container-type: normal; }
  .pe-marco { --W: 116vw; position: relative; inset: auto; width: 100%; height: calc(116vw * .5642); transform: none; }
  .pe-escena { left: -8vw; top: 0; }
}

/* Centro de rotación */
.centro { display: grid; gap: 2.5rem; align-items: center; }
@media (min-width: 900px) { .centro { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 4rem; } }
.centro .galeria { margin-top: 0; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

/* Preceptores sin nombre todavía */
.prof-n.sin-nombre { background: var(--soft); color: var(--muted); font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--line); }

/* =====================================================================
   PORTADA FORMAL: solo texto, fondo negro. El resto del sitio es off-white.
   ===================================================================== */
:root { --f-formal: "Fraunces", "Poppins", Georgia, serif; }

#portada.portada-formal {
  position: relative; isolation: isolate; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  min-height: clamp(320px, 44vh, 460px);
  padding: clamp(3.2rem, 8vw, 5.5rem) 1.5rem;
  background: radial-gradient(120% 100% at 50% 0%, #161616, #000 72%);
  color: #f2efe8; text-align: center;
}
.pf-textura {
  position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: .5;
  background-image: linear-gradient(rgba(255, 255, 255, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .05) 1px, transparent 1px);
  background-size: 34px 34px; mask-image: radial-gradient(70% 70% at 50% 40%, #000, transparent);
}
.pf-cont { position: relative; z-index: 1; max-width: 46rem; margin-inline: auto; }
.pf-ojo {
  margin: 0; font-family: var(--f-ui); font-size: .82rem; font-weight: 600; letter-spacing: .22em; text-transform: uppercase;
  color: #b9b3a6;
}
.pf-titulo {
  margin: .9rem 0 0; font-family: var(--f-formal); font-weight: 600; font-style: normal;
  font-size: clamp(2.6rem, 6.4vw, 4.6rem); line-height: 1.08; letter-spacing: -.01em; color: #f7f4ee;
}
.pf-raya { margin: 1.5rem auto; display: flex; align-items: center; justify-content: center; }
.pf-raya span { display: block; width: 74px; height: 2px; background: var(--amarillo); border-radius: 2px; }
.pf-sub { margin: 0; font-family: var(--f-ui); font-size: clamp(1rem, 1.7vw, 1.15rem); font-weight: 400; color: #cfc9bc; letter-spacing: .01em; }

.pf-bajar {
  position: absolute; left: 50%; bottom: clamp(1rem, 3vw, 1.75rem); transform: translateX(-50%);
  width: 44px; height: 44px; display: grid; place-items: center; z-index: 1;
  border: 1.5px solid rgba(247, 244, 238, .45); border-radius: 50%; background: transparent; color: #f2efe8; cursor: pointer;
}
.pf-bajar:hover { background: rgba(247, 244, 238, .1); border-color: rgba(247, 244, 238, .7); }

.pf-ojo, .pf-titulo, .pf-raya, .pf-sub { opacity: 0; transform: translateY(10px); transition: opacity .7s ease, transform .7s cubic-bezier(.2, .7, .2, 1); }
.pf-titulo { transition-delay: .08s; }
.pf-raya { transition-delay: .16s; }
.pf-sub { transition-delay: .22s; }
.portada-formal.lista .pf-ojo, .portada-formal.lista .pf-titulo, .portada-formal.lista .pf-raya, .portada-formal.lista .pf-sub { opacity: 1; transform: none; }
.pf-bajar { opacity: 0; transition: opacity .6s ease .5s; }
.portada-formal.lista .pf-bajar { opacity: 1; }

@media (max-width: 600px) {
  #portada.portada-formal { min-height: 0; padding-block: 3.2rem 3.6rem; }
  .pf-bajar { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .pf-ojo, .pf-titulo, .pf-raya, .pf-sub, .pf-bajar { opacity: 1 !important; transform: none !important; transition: none !important; }
}

/* =====================================================================
   PORTADA ESTILO "BITÁCORA": textura de gasa verde + etiqueta de papel
   kraft rasgada con letra manuscrita, como la carátula del collage.
   ===================================================================== */
#portada.portada-formal {
  background:
    repeating-linear-gradient(0deg, rgba(255, 255, 255, .3) 0 1px, transparent 1px 9px),
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .3) 0 1px, transparent 1px 9px),
    var(--azul-banda);
  padding: clamp(2.6rem, 7vw, 4.5rem) 1.25rem;
}
.pf-textura { display: none; }

.pf-fila { position: relative; z-index: 1; display: flex; align-items: center; justify-content: center; gap: clamp(1.5rem, 4vw, 3.5rem); flex-wrap: wrap; }

/* Tira de polaroids: una foto grande al centro, con una chiquita arriba y otra abajo */
.pf-tira { flex: 0 0 auto; display: flex; align-items: center; }

.pf-polaroid {
  background: #fbf8ef; padding: .5rem .5rem 1.2rem;
  box-shadow: 0 3px 0 rgba(0, 0, 0, .06), 0 10px 20px rgba(20, 25, 15, .22);
}
.pf-polaroid img { display: block; width: 100%; height: 100%; object-fit: cover; }
.pf-polaroid .foto-vacia {
  width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .4rem;
  border: 2px dashed var(--musgo-osc); color: var(--musgo-osc); background: var(--kraft);
}
.pf-polaroid .foto-vacia svg { width: 22%; height: 22%; }
.pf-polaroid .foto-vacia span { font-family: var(--f-hand); font-size: 1rem; font-weight: 700; padding: 0 .4rem; text-align: center; }

.pf-polaroid-grande { width: min(185px, 26vw); aspect-ratio: 4 / 5; transform: rotate(-3deg); z-index: 2; margin: 0 -.6rem; }
.pf-polaroid-grande .foto-vacia span { font-size: 1.05rem; }
.pf-polaroid-chica { width: min(185px, 26vw); aspect-ratio: 4 / 5; }
.pf-polaroid-chica .foto-vacia span { font-size: 1.05rem; }
.pf-polaroid-arriba { transform: rotate(-6deg); z-index: 1; }
.pf-polaroid-abajo { transform: rotate(6deg); z-index: 3; }


.pf-cont {
  position: relative; z-index: 1; flex: 1 1 26rem; max-width: 34rem;
  background: var(--kraft); color: var(--tinta); padding: 2.2rem 2rem 2.4rem; transform: rotate(-1deg);
  box-shadow: 0 3px 0 rgba(0, 0, 0, .08), 0 18px 30px rgba(20, 25, 15, .22);
  clip-path: polygon(0% 4%, 4% 0%, 9% 3%, 14% 0%, 19% 2%, 25% 0%, 31% 3%, 37% 0%, 43% 2%, 49% 0%, 55% 3%, 61% 0%, 67% 2%, 73% 0%, 79% 3%, 85% 0%, 91% 2%, 97% 0%, 100% 4%, 99% 12%, 100% 25%, 99% 40%, 100% 55%, 99% 70%, 100% 85%, 99% 96%, 96% 100%, 90% 98%, 84% 100%, 78% 97%, 72% 100%, 66% 98%, 60% 100%, 54% 97%, 48% 100%, 42% 98%, 36% 100%, 30% 97%, 24% 100%, 18% 98%, 12% 100%, 6% 97%, 0% 100%, 1% 85%, 0% 70%, 1% 55%, 0% 40%, 1% 25%, 0% 12%);
}
.pf-ojo {
  font-family: var(--f-ui); font-size: .62rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase;
  color: var(--musgo-osc);
}
.pf-titulo {
  font-family: var(--f-hand); font-weight: 700; color: var(--tinta); transform: none;
  font-size: clamp(2.6rem, 8vw, 4rem); line-height: 1; margin-top: .5rem;
}
.pf-raya { justify-content: flex-start; margin: 1.1rem 0; }
.pf-raya span { background: var(--musgo); height: 3px; width: 56px; }
.pf-sub { font-family: var(--f-hand); font-size: 1.35rem; color: var(--pizarra); font-weight: 700; }
.pf-bajar { border-color: rgba(255, 255, 255, .6); color: #fff; bottom: clamp(.8rem, 3vw, 1.4rem); }
.pf-bajar:hover { background: rgba(255, 255, 255, .18); border-color: #fff; }

/* Un par de estrellitas de adorno, como en el collage */
.pf-cont::before, .pf-cont::after {
  content: ""; position: absolute; width: 30px; height: 30px; background: var(--musgo-osc);
  clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.pf-cont::before { top: -14px; left: -10px; transform: rotate(-12deg); }
.pf-cont::after { bottom: -12px; right: 10%; width: 18px; height: 18px; transform: rotate(20deg); opacity: .8; }

/* Portada en pantallas angostas (celular, tablet): la MISMA composición que en
   computadora (fotos a la izquierda, etiqueta a la derecha), solo que a escala. */
@media (max-width: 1000px) {
  #portada.portada-formal { min-height: 0; padding: 6vw 3vw 7vw; }
  .pf-fila { flex-direction: row; flex-wrap: nowrap; gap: 3.5vw; padding-inline: 0; }
  .pf-tira { order: 0; }
  .pf-bajar { display: none; }
  .pf-polaroid { padding: .5vw .5vw 1.2vw; }
  .pf-polaroid-grande { width: 15.5vw; margin: 0 -.6vw; }
  .pf-polaroid-chica { width: 15.5vw; }
  .pf-polaroid .foto-vacia { border-width: max(1px, .2vw); gap: .4vw; }
  .pf-polaroid .foto-vacia span, .pf-polaroid-grande .foto-vacia span { font-size: max(.5rem, 1.5vw); padding: 0 .3vw; }
  .pf-cont { flex: 1 1 auto; min-width: 0; max-width: 54vw; padding: 3.5vw 3.2vw 3.8vw; }
  .pf-ojo { font-size: max(.5rem, 1vw); letter-spacing: .14em; }
  .pf-titulo { font-size: max(1.4rem, 6.4vw); margin-top: .8vw; }
  .pf-raya { margin: 1.8vw 0; }
  .pf-raya span { width: 5.6vw; height: max(2px, .3vw); }
  .pf-sub { font-size: max(.75rem, 2.16vw); }
  .pf-cont::before { width: 3vw; height: 3vw; top: -1.4vw; left: -1vw; }
  .pf-cont::after { width: 1.8vw; height: 1.8vw; bottom: -1.2vw; }
}

/* En el celular: la misma composición, pero ocupando casi todo el ancho y más alta */
@media (max-width: 600px) {
  #portada.portada-formal { padding: 11vw 2vw 12vw; }
  .pf-fila { gap: 3vw; align-items: center; }
  /* Fotos en triángulo invertido: dos arriba y una abajo, al centro */
  .pf-tira { display: grid; grid-template-columns: auto auto; grid-template-areas: "a b" "c c"; justify-items: center; align-items: center; }
  .pf-polaroid-arriba { grid-area: a; margin-right: -2vw; transform: rotate(-6deg); }
  .pf-polaroid-abajo { grid-area: b; margin-left: -2vw; transform: rotate(6deg); z-index: 2; }
  .pf-polaroid-grande { grid-area: c; margin: -9vw 0 0 !important; transform: rotate(-2deg); z-index: 3; }
  .pf-tira { flex: 0 0 auto; }
  .pf-polaroid { padding: 1.4vw 1.4vw 4.4vw; }
  .pf-polaroid-grande { width: 25vw; z-index: 3; }
  .pf-polaroid-chica { width: 25vw; }
  .pf-polaroid .foto-vacia span, .pf-polaroid-grande .foto-vacia span { font-size: max(.7rem, 3.2vw); }

(function () {
  "use strict";

  const app = document.getElementById("app");

  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.prototype.slice.call((el || document).querySelectorAll(s));

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento: no pasa nada */ } },
  };

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // Formato sencillo para textos: párrafos, "## subtítulo", "- viñeta", **negrita**, *cursiva*
  const inline = (s) => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g, "$1<em>$2</em>");
  function fmt(text) {
    return String(text || "").trim().split(/\n\s*\n/).map((bloque) => {
      const lineas = bloque.split("\n").map((l) => l.trim()).filter(Boolean);
      if (!lineas.length) return "";
      if (lineas[0].indexOf("## ") === 0) {
        return "<h3>" + inline(lineas[0].slice(3)) + "</h3>" + (lineas.length > 1 ? fmt(lineas.slice(1).join("\n")) : "");
      }
      if (lineas.every((l) => /^[-•] /.test(l))) {
        return "<ul>" + lineas.map((l) => "<li>" + inline(l.slice(2)) + "</li>").join("") + "</ul>";
      }
      return "<p>" + lineas.map(inline).join(" ") + "</p>";
    }).join("");
  }

  const pl = (n, s, p) => n + " " + (n === 1 ? s : p);
  const pad2 = (n) => (n < 10 ? "0" : "") + n;

  /* ---------- archivos: rutas y detección ---------- */
  // "clase-01.pdf" -> "archivos/clase-01.pdf". Si ya trae carpeta o es un enlace, se deja igual.
  // Los archivos (PDF, fotos) van junto a index.html. Si prefieres una carpeta, en contenido.js escribe: const CARPETA_ARCHIVOS = "archivos";
  const CARPETA = (typeof CARPETA_ARCHIVOS === "string" && CARPETA_ARCHIVOS) ? CARPETA_ARCHIVOS.replace(/\/+$/, "") + "/" : "";
  function ruta(p) {
    if (!p) return "";
    p = String(p).trim();
    if (p.slice(0, 5) === "data:") return p;
    if (/^(https?:)?\/\//.test(p) || p.indexOf("/") > -1) return encodeURI(p);
    return encodeURI(CARPETA + p);
  }

  const cacheExiste = {};
  function existe(url) {
    // En la vista previa local (archivo abierto directamente) no se puede detectar: solo funcionan los archivos escritos a mano.
    if (location.protocol === "file:") return Promise.resolve(false);
    if (url in cacheExiste) return cacheExiste[url];
    cacheExiste[url] = fetch(url, { method: "HEAD", cache: "no-cache" }).then((r) => r.ok).catch(() => false);
    return cacheExiste[url];
  }

  /* ---------- datos derivados ---------- */
  const total = CLASES.length;
  const semanasTotal = Math.max.apply(null, CLASES.map((c) => c.semana));
  const byId = (id) => CLASES.find((c) => c.id === id);
  const detectados = {};

  const explicito = (id) => {
    const r = RESUMENES[id];
    return !!(r && (r.pdf || (r.hojas && r.hojas.length) || r.imagen || r.archivo || r.enlace || String(r.resumen || "").trim()));
  };
  const listo = (id) => explicito(id) || !!detectados[id];
  const listosCount = () => CLASES.filter((c) => listo(c.id)).length;
  const minutos = (txt) => Math.max(1, Math.round(String(txt).trim().split(/\s+/).length / 200));

  function pintarEstados() {
    $$("[data-est]").forEach((el) => {
      const ok = listo(Number(el.getAttribute("data-est")));
      el.className = "st " + (ok ? "ok" : "no");
      el.textContent = ok ? "Resumen listo" : "En preparación";
    });
    const c = $("#cuenta");
    if (c) c.textContent = listosCount() + " de " + total + " resúmenes listos";
  }

  function detectar() {
    return Promise.all(CLASES.map((c) =>
      existe(ruta("clase-" + pad2(c.id) + ".pdf")).then((ok) => { detectados[c.id] = ok; })
    )).then(pintarEstados);
  }

  /* ---------- visor de documentos (PDF, Canva, Drive) ---------- */

  }

  function barraVisor(src, t, etiqueta, descarga) {
    return '<div class="visor-bar"><span class="visor-t">' + esc(t) + '</span><span class="visor-btns"><a class="btn peq" href="' + src + '" target="_blank" rel="noopener">' + etiqueta + "</a>" +
      (descarga ? '<a class="btn peq ghost" href="' + src + '" download>Descargar</a>' : "") + "</span></div>";
  }

  function visorArchivo(src, t) {
    const ext = (src.split("?")[0].split("#")[0].split(".").pop() || "").toLowerCase();
    if (ext === "pdf") {
      return barraVisor(src, t, "Abrir en pestaña nueva", true) +
        '<iframe class="visor-frame" src="' + src + '#view=FitH" title="' + esc(t) + '" loading="lazy"></iframe>' +
        '<p class="visor-nota">Si la vista previa no se ve bien en tu celular, toca «Abrir en pestaña nueva».</p>';
    }
    if (["png", "jpg", "jpeg", "webp", "gif"].indexOf(ext) > -1) {
      return barraVisor(src, t, "Abrir en pestaña nueva", true) + '<img class="visor-img" src="' + src + '" alt="' + esc(t) + '">';
    }
    return barraVisor(src, t, "Abrir archivo", true);
  }

  function visorEnlace(url, t) {
    const cv = /^https?:\/\/(www\.)?canva\.com\/design\/([^\/?#]+)\/([^\/?#]+)/.exec(url);
    const dr = /drive\.google\.com\/file\/d\/([^\/?#]+)/.exec(url);
    let embed = "";
    if (cv) embed = "https://www.canva.com/design/" + cv[2] + "/" + cv[3] + "/view?embed";
    else if (dr) embed = "https://drive.google.com/file/d/" + dr[1] + "/preview";
    const etiqueta = cv ? "Abrir en Canva" : dr ? "Abrir en Drive" : "Abrir enlace";
    return barraVisor(esc(url), t, etiqueta, false) + (embed ? '<iframe class="visor-frame" src="' + esc(embed) + '" title="' + esc(t) + '" loading="lazy" allowfullscreen></iframe>' : "");
  }

  async function montarVisor(el) {
    const a = el.getAttribute("data-a"), e = el.getAttribute("data-e"), auto = el.getAttribute("data-auto");
    const t = el.getAttribute("data-t"), vacio = el.getAttribute("data-v");
    let src = a ? ruta(a) : "";
    if (!src && !e && auto) { const r = ruta(auto); if (await existe(r)) src = r; }
    if (src) el.innerHTML = visorArchivo(src, t);
    else if (e) el.innerHTML = visorEnlace(e, t);
    else if (vacio) el.innerHTML = '<div class="pendiente"><p>' + esc(vacio) + "</p></div>";
    else el.innerHTML = "";
  }
