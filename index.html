  /* Las hojas de resumen son una sola imagen con todas las páginas apiladas
     (cada página 1241×1755 px, con 28 px de separación). Para mostrar una sola
     página, se recorta la imagen con un marco del tamaño de una página. */
  const PAG_H = 1755, PAG_GAP = 28;
  /* d = 1 (siguiente) o -1 (anterior): la página actual sale hacia un lado y la nueva entra por el otro */
  /* Cambia a la página k (cada página es su propia imagen, en img._hojas).
     d = 1 (siguiente) o -1 (anterior): la página actual sale hacia un lado y la nueva entra por el otro */
  /* ---------- Lector de PDF (PDF.js): dibuja una página del PDF, nítida a cualquier zoom ---------- */
  const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  let pdfjsPromesa = null;
  function cargarPdfjs() {
    if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
    if (!pdfjsPromesa) pdfjsPromesa = new Promise((ok, mal) => {
      const sc = document.createElement("script");
      sc.src = PDFJS + "pdf.min.js";
      sc.onload = () => { window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.js"; ok(window.pdfjsLib); };
      sc.onerror = () => { pdfjsPromesa = null; mal(new Error("No cargó el lector de PDF")); };
      document.head.appendChild(sc);
    });
    return pdfjsPromesa;
  }
  const pdfAbiertos = {};
  function abrirPdf(url) {
    if (!pdfAbiertos[url]) pdfAbiertos[url] = cargarPdfjs().then((lib) => lib.getDocument({
      url, cMapUrl: PDFJS + "cmaps/", cMapPacked: true, standardFontDataUrl: PDFJS + "standard_fonts/",
    }).promise).catch((e) => { delete pdfAbiertos[url]; throw e; });
    return pdfAbiertos[url];
  }
  // Dibuja la página k del PDF en el canvas, al ancho en pantalla del canvas (multiplicado por la densidad de la pantalla)
  function pintarPdf(canvas, k) {
    const turno = (canvas._turno = (canvas._turno || 0) + 1);
    return abrirPdf(canvas._pdf).then((pdf) => pdf.getPage(k + 1)).then((pag) => {
      const base = pag.getViewport({ scale: 1 });
      const ancho = Math.max(200, canvas.clientWidth || (canvas.parentElement && canvas.parentElement.clientWidth) || 800);
      let esc = (ancho * Math.min(window.devicePixelRatio || 1, 3)) / base.width;
      const maxPx = 16000000; // límite de tamaño de lienzo en iPhone
      if (base.width * base.height * esc * esc > maxPx) esc = Math.sqrt(maxPx / (base.width * base.height));
      const vp = pag.getViewport({ scale: esc });
      const tmp = document.createElement("canvas");
      tmp.width = Math.floor(vp.width); tmp.height = Math.floor(vp.height);
      return pag.render({ canvasContext: tmp.getContext("2d"), viewport: vp }).promise.then(() => {
        if (turno !== canvas._turno) return;
        canvas.width = tmp.width; canvas.height = tmp.height;
        canvas.getContext("2d").drawImage(tmp, 0, 0);
        canvas._k = k;
        const cargando = canvas.parentElement && canvas.parentElement.querySelector(".hp-cargando");
        if (cargando) cargando.remove();
      });
    }).catch(() => {
      const cargando = canvas.parentElement && canvas.parentElement.querySelector(".hp-cargando");
      if (cargando) cargando.textContent = "No se pudo cargar el resumen. Revisa tu conexión y vuelve a abrir la clase.";
    });
  }
  function moverPaginaPdf(canvas, k, d) {
    if (canvas.getAnimations) canvas.getAnimations().forEach((a) => a.cancel());
    const quieto = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!d || quieto || !canvas.animate) return pintarPdf(canvas, k);
    const sale = canvas.animate([{ transform: "translateX(0)", opacity: 1 }, { transform: "translateX(" + (-d * 100) + "%)", opacity: .4 }], { duration: 170, easing: "ease-in", fill: "forwards" });
    sale.onfinish = () => {
      pintarPdf(canvas, k).then(() => {
        sale.cancel();
        canvas.animate([{ transform: "translateX(" + (d * 100) + "%)", opacity: .4 }, { transform: "translateX(0)", opacity: 1 }], { duration: 230, easing: "ease-out" });
      });
    };
  }

  function moverPagina(img, k, n, d) {
    if (img.tagName === "CANVAS") return moverPaginaPdf(img, k, d);
    const L = img._hojas || [];
    const nueva = L[k];
    if (!nueva) return;
    if (img.getAnimations) img.getAnimations().forEach((a) => a.cancel());
    img.style.transform = "";
    [k + 1, k - 1].forEach((j) => { if (L[j]) { const pre = new Image(); pre.src = L[j]; } });
    const quieto = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!d || quieto || !img.animate) { if (img.getAttribute("src") !== nueva) img.src = nueva; return; }
    const sale = img.animate([{ transform: "translateX(0)", opacity: 1 }, { transform: "translateX(" + (-d * 100) + "%)", opacity: .4 }], { duration: 170, easing: "ease-in", fill: "forwards" });
    sale.onfinish = () => {
      let hecho = false;
      const entra = () => {
        if (hecho) return; hecho = true;
        sale.cancel();
        img.animate([{ transform: "translateX(" + (d * 100) + "%)", opacity: .4 }, { transform: "translateX(0)", opacity: 1 }], { duration: 230, easing: "ease-out" });
      };
      img.addEventListener("load", entra, { once: true });
      img.addEventListener("error", entra, { once: true });
      img.src = nueva;
      if (img.complete && img.naturalWidth) entra();
      setTimeout(entra, 1500);
    };
  }

  /* Visor a pantalla completa (dentro de la misma página), con zoom y páginas */
  function abrirHoja(hojas, titulo, n, k0) {
    const niveles = [1, 1.5, 2, 3];
    let z = 0, k = k0 || 0;
    n = Math.max(1, n || 1);
    const esPdf = typeof hojas === "string";
    const src = esPdf ? "" : (hojas[k] || hojas[0]);
    const caja = document.createElement("div");
    caja.className = "hoja-lb";
    caja.setAttribute("role", "dialog");
    caja.setAttribute("aria-modal", "true");
    caja.setAttribute("aria-label", titulo || "Resumen");
    caja.innerHTML =
      '<div class="hoja-lb-bar"><span class="hoja-lb-t"></span>' +
      '<button type="button" data-z="-1" aria-label="Alejar">−</button><button type="button" data-z="1" aria-label="Acercar">+</button>' +
      '<button type="button" class="hoja-lb-x" aria-label="Cerrar">✕</button></div>' +
      '<div class="hoja-lb-scroll"><div class="hoja-lb-marco">' + (esPdf ? '<canvas width="1241" height="1755"></canvas>' : '<img src="' + src + '" alt="">') + '</div></div>' +
      (n > 1 ? '<div class="hoja-lb-pie"><button type="button" data-p="-1" aria-label="Página anterior">‹</button><span class="hoja-lb-cont" aria-live="polite"></span><button type="button" data-p="1" aria-label="Página siguiente">›</button></div>' : '');
    const img = caja.querySelector(esPdf ? "canvas" : "img"), sc = caja.querySelector(".hoja-lb-scroll"), marco = caja.querySelector(".hoja-lb-marco");
    if (esPdf) img._pdf = hojas; else img._hojas = hojas;
    const aplicarZoom = () => {
      const cx = (sc.scrollLeft + sc.clientWidth / 2) / (sc.scrollWidth || 1);
      const cy = (sc.scrollTop + sc.clientHeight / 2) / (sc.scrollHeight || 1);
      marco.style.width = (niveles[z] * 100) + "%";
      marco.classList.toggle("ampliado", z > 0);
      sc.scrollLeft = cx * sc.scrollWidth - sc.clientWidth / 2;
      sc.scrollTop = cy * sc.scrollHeight - sc.clientHeight / 2;
      caja.querySelector('[data-z="-1"]').disabled = z === 0;
      caja.querySelector('[data-z="1"]').disabled = z === niveles.length - 1;
      if (esPdf) { clearTimeout(img._rz); img._rz = setTimeout(() => pintarPdf(img, k), 60); }
    };
    const aplicarPag = (d) => {
      moverPagina(img, k, n, d);
      sc.scrollTop = 0;
      if (n > 1) {
        caja.querySelector(".hoja-lb-cont").textContent = "Página " + (k + 1) + " de " + n;
        caja.querySelector('[data-p="-1"]').disabled = k === 0;
        caja.querySelector('[data-p="1"]').disabled = k === n - 1;
      }
    };
    const cerrar = () => { caja.remove(); document.body.style.overflow = ""; document.removeEventListener("keydown", tecla); };
    const ir = (d) => { const nk = Math.max(0, Math.min(n - 1, k + d)); if (nk !== k) { k = nk; aplicarPag(d); } };
    const tecla = (e) => { if (e.key === "Escape") cerrar(); else if (e.key === "ArrowRight") ir(1); else if (e.key === "ArrowLeft") ir(-1); };
    caja.querySelectorAll("[data-z]").forEach((b) => b.addEventListener("click", () => {
      z = Math.max(0, Math.min(niveles.length - 1, z + Number(b.getAttribute("data-z")))); aplicarZoom();
    }));
    caja.querySelectorAll("[data-p]").forEach((b) => b.addEventListener("click", () => ir(Number(b.getAttribute("data-p")))));
    deslizar(sc, (d) => { if (z === 0) ir(d); });
    caja.querySelector(".hoja-lb-x").addEventListener("click", cerrar);
    document.addEventListener("keydown", tecla);
    document.body.appendChild(caja);
    document.body.style.overflow = "hidden";
    aplicarZoom(); aplicarPag();
    caja.querySelector(".hoja-lb-x").focus();
  }

  /* Deslizar el dedo a izquierda/derecha para pasar de página */
  function deslizar(el, fn) {
    let x0 = null, y0 = 0;
    el.addEventListener("touchstart", (e) => { if (e.touches.length === 1) { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; } else x0 = null; }, { passive: true });
    el.addEventListener("touchend", (e) => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
      x0 = null;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) fn(dx < 0 ? 1 : -1);
    }, { passive: true });
  }

  function bindClase(id) {
    const hojaPdf = $(".res-pdf");
    if (hojaPdf) {
      const R0 = RESUMENES[id] || {};
      const url = ruta(R0.pdf);
      const cv = hojaPdf.querySelector(".hp-vista canvas");
      cv._pdf = url;
      let n = 1, k = 0;
      const pintar = (d) => {
        moverPagina(cv, k, n, d);
        const cont = hojaPdf.querySelector(".hp-cont");
        if (cont) cont.textContent = n > 1 ? "Página " + (k + 1) + " de " + n + " ·" : "";
        hojaPdf.querySelector(".hp-ant").disabled = k === 0;
        hojaPdf.querySelector(".hp-sig").disabled = k >= n - 1;
      };
      const ir = (d) => { const nk = Math.max(0, Math.min(n - 1, k + d)); if (nk !== k) { k = nk; pintar(d); } };
      hojaPdf.querySelectorAll("[data-paso]").forEach((b) => b.addEventListener("click", () => ir(Number(b.getAttribute("data-paso")))));
      deslizar(hojaPdf.querySelector(".hp"), ir);
      hojaPdf.querySelectorAll("[data-hoja]").forEach((b) => b.addEventListener("click", () => {
        const c = byId(id);
        abrirHoja(url, c ? "Resumen: " + c.tema : "Resumen", n, k);
      }));
      abrirPdf(url).then((pdf) => { n = pdf.numPages; pintar(); }).catch(() => pintar());
    } else if (!explicito(id)) {
      // Resumen nuevo subido como clase-NN.pdf (sin escribir nada en el código): se detecta y se muestra
      const nombre = "clase-" + pad2(id) + ".pdf";
      existe(ruta(nombre)).then((ok) => { if (ok && location.hash.indexOf("/clase/" + id) > -1) { RESUMENES[id] = Object.assign({}, RESUMENES[id], { pdf: nombre }); render(); } });
    }
    const hoja = $(".res-hoja:not(.res-pdf)");
    if (hoja) {
      const n = Number(hoja.getAttribute("data-n")) || 1;
      const img = hoja.querySelector(".hp-vista img");
      const R0 = RESUMENES[id] || {};
      const lista = (R0.hojas && R0.hojas.length ? R0.hojas : [R0.imagen]).filter(Boolean).map(ruta);
      img._hojas = lista;
      let k = 0;
      const pintar = (d) => {
        moverPagina(img, k, n, d);
        const cont = hoja.querySelector(".hp-cont");
        if (cont) cont.textContent = "Página " + (k + 1) + " de " + n;
        const a = hoja.querySelector(".hp-ant"), s2 = hoja.querySelector(".hp-sig");
        if (a) a.disabled = k === 0;
        if (s2) s2.disabled = k === n - 1;
      };
      const ir = (d) => { const nk = Math.max(0, Math.min(n - 1, k + d)); if (nk !== k) { k = nk; pintar(d); } };
      hoja.querySelectorAll("[data-paso]").forEach((b) => b.addEventListener("click", () => ir(Number(b.getAttribute("data-paso")))));
      deslizar(hoja.querySelector(".hp"), ir);
      hoja.querySelectorAll("[data-hoja]").forEach((b) => b.addEventListener("click", () => {
        const c = byId(id);
        abrirHoja(lista, c ? "Resumen: " + c.tema : "Resumen", n, k);
      }));
      pintar();
    }
    $$(".fc").forEach((b) => b.addEventListener("click", () => b.setAttribute("aria-expanded", b.getAttribute("aria-expanded") === "true" ? "false" : "true")));
    $$(".claves input").forEach((cb) => cb.addEventListener("change", () => {
      const todo = store.get("claves", {});
      todo[id] = $$(".claves input").filter((x) => x.checked).map((x) => Number(x.getAttribute("data-i")));
      store.set("claves", todo);
    }));
  }

  /* ---------- TALLERES ---------- */
  function viewTalleres() {
    const cuerpo = TALLERES.length ? TALLERES.map((t, i) =>
      '<section class="taller"><div class="tit"><h2>' + esc(t.tema) + '</h2><p class="sub">' + esc(t.profe) + "</p></div>" +
      '<div class="pills">' + (t.semana ? '<span class="pill azul">Semana ' + t.semana + "</span>" : "") + '<span class="pill oscura">Taller ' + (i + 1) + "</span></div>" +
      '<div class="dos-taller"><div>' + (t.descripcion ? '<div class="cuerpo">' + fmt(t.descripcion) + "</div>" : "") +
      visorSlot({ archivo: t.archivo, enlace: t.enlace, auto: "taller-" + (i + 1) + ".pdf", titulo: "Taller: " + t.tema, vacio: "El material de este taller todavía está en preparación." }) +
      "</div><div>" + galeria(t.fotos, 2, t.tema) + "</div></div></section>"
    ).join("") : vacioPag("Todavía no hay talleres publicados.");
    return cab("Talleres", "Lo que practicamos con las manos.") + '<div class="wrap pagina">' + cuerpo + "</div>";
  }

  /* ---------- ROTACIONES ---------- */
  function viewRotaciones() {
    const sems = ROTACION.semanas;
    if (rotTab > sems.length) rotTab = 0;
    const tabs = ['<button type="button" role="tab" data-s="0" aria-selected="' + (rotTab === 0) + '">Toda la rotación</button>']
      .concat(sems.map((s, i) => '<button type="button" role="tab" data-s="' + (i + 1) + '" aria-selected="' + (i + 1 === rotTab) + '">Semana ' + (i + 1) + "</button>")).join("");

    let cuerpo;
    if (rotTab === 0) {
      const b = ROTACION.bitacora || {};
      cuerpo = '<div class="tit"><h2>Bitácora completa</h2><p class="sub">' + esc(ROTACION.hospital) + "</p></div>" +
        '<div class="bloque">' + visorSlot({ archivo: b.archivo, enlace: b.enlace, auto: "bitacora-completa.pdf", titulo: "Bitácora de rotación", vacio: "La bitácora completa todavía está en preparación." }) + "</div>" +
        '<div class="bloque"><h3 class="mini">Fotos de la rotación</h3>' + galeria(ROTACION.fotos, 3, "Rotación") + "</div>";
    } else {
      const w = sems[rotTab - 1] || {};
      cuerpo = '<div class="tit"><h2>Semana ' + rotTab + '</h2><p class="sub">' + esc(w.servicio || "Servicio por definir") + "</p></div>" +
        (w.nota ? '<div class="cuerpo bloque">' + fmt(w.nota) + "</div>" : "") +
        '<div class="bloque">' + visorSlot({ archivo: w.archivo, enlace: w.enlace, auto: "bitacora-semana-" + rotTab + ".pdf", titulo: "Bitácora de la semana " + rotTab, vacio: "La bitácora de esta semana todavía está en preparación." }) + "</div>" +
        '<div class="bloque"><h3 class="mini">Fotos de la semana</h3>' + galeria(w.fotos, 3, "Semana " + rotTab) + "</div>";
    }
    return (
      cab("Rotaciones", "Mi paso por el " + esc(ROTACION.hospital) + ", semana por semana.", '<div class="tabs" role="tablist" aria-label="Semanas de rotación">' + tabs + "</div>") +
      '<div class="wrap pagina">' + cuerpo + '<p class="aviso"><b>Ojo con la privacidad.</b> Los casos están anonimizados: sin nombres, iniciales, camas ni datos que identifiquen a un paciente.</p></div>'
    );
  }

  function bindRotaciones() {
    $$(".tabs button").forEach((b) => b.addEventListener("click", () => { rotTab = Number(b.getAttribute("data-s")); render(false); }));
  }

  /* ---------- MULTIMEDIA ---------- */
  function viewMultimedia() {
    const chip = (v, t) => '<button type="button" class="chip" data-f="' + v + '" aria-pressed="' + (mmFiltro === v) + '">' + t + "</button>";
    const items = MULTIMEDIA.filter((m) => mmFiltro === "todo" || m.tipo === mmFiltro);
    let grid;
    if (!MULTIMEDIA.length) {
      grid = '<div class="mm-grid">' + [1, 2, 3, 4, 5, 6].map(() => '<div class="foto-cel">' + fotoVacia("Aquí va tu foto o video") + "</div>").join("") + "</div>";
    } else if (!items.length) {
      grid = vacioPag("No hay nada de este tipo por ahora.");
    } else {
      grid = '<div class="mm-grid">' + items.map((m) => {
        const cap = (m.titulo || m.descripcion) ? "<figcaption>" + (m.titulo ? "<b>" + esc(m.titulo) + "</b>" : "") + (m.descripcion ? "<span>" + esc(m.descripcion) + "</span>" : "") + "</figcaption>" : "";
        if (m.tipo === "video") return '<figure class="mm">' + videoHtml(m) + cap + "</figure>";
        return '<figure class="mm"><button type="button" class="foto" data-full="' + esc(ruta(m.archivo)) + '" data-cap="' + esc(m.titulo || "") + '"><img src="' + esc(ruta(m.archivo)) + '" alt="' + esc(m.titulo || "Foto") + '" loading="lazy" data-fb="Foto no encontrada"></button>' + cap + "</figure>";
      }).join("") + "</div>";
    }
    return (
      cab("Multimedia", "Fotos y videos de las clases, los talleres y la rotación.",
        MULTIMEDIA.length ? '<div class="chips" role="group" aria-label="Filtrar">' + chip("todo", "Todo") + chip("foto", "Fotos") + chip("video", "Videos") + "</div>" : "") +
      '<div class="wrap pagina">' + grid + "</div>"
    );
  }

  function bindMultimedia() {
    $$(".chip").forEach((b) => b.addEventListener("click", () => { mmFiltro = b.getAttribute("data-f"); render(false); }));
  }

  /* ---------- TRABAJOS ---------- */
  function viewTrabajos() {
    let cuerpo;
    if (!TRABAJOS.length) {
      cuerpo = '<ul class="trabajos">' + [1, 2, 3].map(() => '<li class="trabajo vacio-t"><span>Aquí va tu próximo trabajo</span></li>').join("") + "</ul>";
    } else {
      cuerpo = '<ul class="trabajos">' + TRABAJOS.map((t) =>
        '<li class="trabajo"><details><summary><span class="tt">' + esc(t.titulo) + "</span>" + (t.fecha ? '<span class="pill peq">' + esc(t.fecha) + "</span>" : "") + "</summary>" +
        '<div class="tc">' + (t.descripcion ? '<div class="cuerpo">' + fmt(t.descripcion) + "</div>" : "") +
        visorSlot({ archivo: t.archivo, enlace: t.enlace, titulo: t.titulo, vacio: (t.archivo || t.enlace) ? "" : "El documento de este trabajo todavía no está subido." }) +
        galeria(t.fotos, 0, t.titulo) + "</div></details></li>"
      ).join("") + "</ul>";
    }
    return cab("Trabajos", "Los trabajos y casos que he entregado en la materia.") + '<div class="wrap pagina">' + cuerpo + "</div>";
  }

  /* ---------- EXTRAS ---------- */
  function viewExtras() {
    let cuerpo;
    if (!EXTRAS.length) {
      cuerpo = '<ul class="extras">' + [1, 2, 3].map(() => '<li class="extra"><div class="extra-f">' + fotoVacia("Aquí va tu foto") + '</div><div class="extra-t"><b>Aquí va un extra</b><span>Guías, algoritmos, enlaces útiles.</span></div></li>').join("") + "</ul>";
    } else {
      cuerpo = '<ul class="extras">' + EXTRAS.map((x) => {
        const url = x.archivo ? ruta(x.archivo) : x.enlace ? esc(x.enlace) : "";
        return '<li class="extra"><div class="extra-f">' + imgHtml(x.foto, x.titulo, "Aquí va tu foto") + '</div><div class="extra-t"><b>' + esc(x.titulo) + "</b>" +
          (x.descripcion ? "<span>" + esc(x.descripcion) + "</span>" : "") + (url ? '<a class="btn peq" href="' + url + '" target="_blank" rel="noopener">Abrir</a>' : "") + "</div></li>";
      }).join("") + "</ul>";
    }
    return cab("Extras", "Material aparte que me ha servido.") + '<div class="wrap pagina">' + cuerpo + "</div>";
  }

  function viewNoEncontrado() {
    return cab("Esa página no existe", "Puede que el enlace esté mal escrito.") +
      '<div class="wrap pagina"><div class="acciones"><a class="btn" href="#/">Ir al inicio</a><a class="btn ghost" href="#/clases">Ver las clases</a></div></div>';
  }

  /* ---------- rutas ---------- */
  function parseRoute() {
    const raw = location.hash.replace(/^#\/?/, "");
    return { parts: raw.split("?")[0].split("/").filter(Boolean) };
  }

  function marcarNav() {
    let key = parseRoute().parts[0] || "";
    if (key === "clase") key = "clases";
    if (key === "rotacion") key = "rotaciones";
    $$("a", nav).forEach((a) => {
      if (a.getAttribute("data-r") === key) a.setAttribute("aria-current", "page");
      else a.removeAttribute("aria-current");
    });
  }

  function renderInterno(scroll) {
    const r = parseRoute();
    const ruta0 = r.parts[0] || "";
    let html = "", despues = null, titulo = PERFIL.blog + " - " + PERFIL.nombre;
    const t = (x) => x + " - " + PERFIL.blog;

    if (ruta0 === "") { html = viewHome(); despues = bindHome; }
    else if (ruta0 === "clases") { html = viewClases(); titulo = t("Clases"); }
    else if (ruta0 === "clase") {
      const id = Number(r.parts[1]); const c = byId(id);
      html = viewClase(id); despues = () => bindClase(id);
      if (c) titulo = t(c.tema);
    }
    else if (ruta0 === "talleres") { html = viewTalleres(); titulo = t("Talleres"); }
    else if (ruta0 === "rotaciones" || ruta0 === "rotacion") { html = viewRotaciones(); despues = bindRotaciones; titulo = t("Rotaciones"); }
    else if (ruta0 === "multimedia") { html = viewMultimedia(); despues = bindMultimedia; titulo = t("Multimedia"); }
    else if (ruta0 === "trabajos") { html = viewTrabajos(); titulo = t("Trabajos"); }
    else if (ruta0 === "extras") { html = viewExtras(); titulo = t("Extras"); }
    else { html = viewNoEncontrado(); }

    document.body.classList.toggle("en-inicio", ruta0 === "");
    app.classList.remove("ruta-in");
    app.innerHTML = html;
    if (ruta0 !== "") { void app.offsetWidth; app.classList.add("ruta-in"); }
    document.title = titulo;
    marcarNav();
    if (despues) despues();
    $$(".visor").forEach(montarVisor);
    if (scroll !== false) { window.scrollTo(0, 0); app.focus({ preventScroll: true }); }
    alScroll();
  }

  function render(scroll) {
    try { renderInterno(scroll); }
    catch (e) {
      if (window.console) console.error(e);
      app.innerHTML = '<div class="wrap pagina"><div class="pendiente"><h2>Algo no cargó bien</h2><p>Casi siempre pasa porque un archivo del sitio no se actualizó todavía. Recarga con Cmd+Shift+R (o Ctrl+Shift+R) y revisa que index.html, estilos.css, app.js y contenido.js estén subidos en GitHub.</p><p style="margin-top:.8rem;font-size:.85rem">Detalle técnico: ' + esc(e && e.message) + '</p></div></div>';
    }
  }

  /* ---------- encabezado transparente en el inicio y movimiento de la portada al bajar ---------- */
  let esperando = false;
  function alScroll() {
    if (esperando) return;
    esperando = true;
    requestAnimationFrame(() => {
      esperando = false;
      const y = window.pageYOffset || 0;
      document.body.classList.toggle("desplazado", y > 40);
      const p = $("#portada");
      if (p && y < window.innerHeight * 1.3) p.style.setProperty("--sy", Math.round(y));
    });
  }
  window.addEventListener("scroll", alScroll, { passive: true });

  /* ---------- fotos que no cargan: se muestra el espacio vacío ---------- */
  app.addEventListener("error", (e) => {
    const img = e.target;
    if (!img || img.tagName !== "IMG") return;
    if (img.hasAttribute("data-fb-avatar")) {
      const s = document.createElement("span");
      s.className = "avatar ini"; s.textContent = img.getAttribute("data-fb-avatar");
      if (img.parentNode) img.parentNode.replaceWith(s);
      return;
    }
    const s = img.getAttribute("src") || "";
    const intento = img.getAttribute("data-reintento");
    if (!intento && s && !/^(https?:|data:|archivos\/)/i.test(s)) {
      img.setAttribute("data-reintento", "1"); img.setAttribute("src", "archivos/" + s); return;
    }
    if (intento === "1") img.setAttribute("data-reintento", "2");
    if (img.hasAttribute("data-oculta")) { img.style.display = "none"; return; }
    if (!img.hasAttribute("data-fb")) return;
    const holder = document.createElement("div");
    holder.innerHTML = fotoVacia(img.getAttribute("data-fb"));
    const p = img.parentNode;
    if (p && p.classList && p.classList.contains("foto")) p.removeAttribute("data-full");
    img.replaceWith(holder.firstChild);
  }, true);

  /* ---------- ampliar fotos ---------- */
  const lb = document.createElement("div");
  lb.className = "lb"; lb.hidden = true; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-modal", "true"); lb.setAttribute("aria-label", "Foto ampliada");
  lb.innerHTML = '<button type="button" class="lb-x" aria-label="Cerrar">×</button><img alt=""><p class="lb-cap"></p>';
  document.body.appendChild(lb);
  const cerrarLb = () => { lb.hidden = true; document.body.classList.remove("sin-scroll"); };
  lb.addEventListener("click", (e) => { if (e.target !== $("img", lb)) cerrarLb(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !lb.hidden) cerrarLb(); });
  app.addEventListener("click", (e) => {
    const b = e.target.closest ? e.target.closest(".foto[data-full]") : null;
    if (!b) return;
    $("img", lb).src = b.getAttribute("data-full");
    $("img", lb).alt = b.getAttribute("data-cap") || "Foto ampliada";
    $(".lb-cap", lb).textContent = b.getAttribute("data-cap") || "";
    lb.hidden = false; document.body.classList.add("sin-scroll");
    $(".lb-x", lb).focus();
  });

  const firma = $("#pie-firma");
  if (firma) firma.textContent = PERFIL.nombre + ", " + PERFIL.universidad + ", " + PERFIL.semestre + ".";

  window.addEventListener("hashchange", () => render(true));
  render(false);
  detectar();
})();

  
  
  </script>
</body>
</html>
